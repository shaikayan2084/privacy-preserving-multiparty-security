{% extends "base.html" %}{% block title %}Forgot Password{% endblock %}
{% block extra_css %}<style>
.auth-wrap{min-height:calc(100vh - 64px);display:flex;align-items:center;justify-content:center;padding:40px 20px;background:var(--navy);}
.auth-card{width:100%;max-width:420px;background:var(--navy2);border:1px solid rgba(0,212,232,0.15);border-radius:20px;overflow:hidden;}
.auth-header{padding:28px 32px 20px;border-bottom:1px solid rgba(255,255,255,0.06);}
.auth-title{font-family:Syne,sans-serif;font-size:22px;font-weight:800;color:var(--white);}
.auth-sub{font-family:monospace;font-size:11px;color:var(--gray);margin-top:4px;}
.auth-body{padding:28px 32px;}
.form-label{display:block;font-family:monospace;font-size:10px;color:var(--gray);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:8px;}
.form-input{width:100%;background:var(--navy);border:1px solid rgba(0,212,232,0.15);color:var(--white);padding:11px 15px;border-radius:8px;font-size:14px;outline:none;transition:border .2s;margin-bottom:16px;}
.form-input:focus{border-color:var(--cyan);}
.btn-submit{width:100%;background:var(--cyan);color:var(--navy);border:none;padding:12px;border-radius:8px;font-family:Syne,sans-serif;font-size:14px;font-weight:700;cursor:pointer;transition:all .2s;}
.btn-submit:hover{background:var(--cyan2);}
.info-msg{background:rgba(0,212,232,0.08);border:1px solid rgba(0,212,232,0.2);color:var(--cyan);padding:12px 16px;border-radius:8px;font-size:13px;margin-bottom:16px;}
.back-link{display:block;text-align:center;margin-top:16px;font-size:13px;color:var(--gray);}
.back-link a{color:var(--cyan);}
</style>{% endblock %}
{% block content %}
<div class="auth-wrap"><div class="auth-card">
  <div class="auth-header"><div style="font-size:28px;margin-bottom:8px;">🔑</div>
    <div class="auth-title">Reset Password</div>
    <div class="auth-sub">We'll send a link — generic response either way</div>
  </div>
  <div class="auth-body">
    {% if message %}<div class="info-msg">ℹ {{ message }}</div>{% endif %}
    <form method="POST">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
      <label class="form-label">Email Address</label>
      <input class="form-input" type="email" name="email" placeholder="you@example.com" required/>
      <button type="submit" class="btn-submit">Send Reset Link →</button>
    </form>
    <div class="back-link"><a href="{{ url_for('auth.login') }}">← Back to Login</a></div>
  </div>
</div></div>
{% endblock %}
